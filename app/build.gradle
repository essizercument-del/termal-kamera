plugins {
    id 'com.android.application'
}

def runNo = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.ercument.termalkamera'
    compileSdk 34

    defaultConfig {
        applicationId "com.ercument.termalkamera"
        minSdk 24
        targetSdk 34
        versionCode runNo
        versionName "tani-0.1." + runNo
    }

    // Sabit imza anahtarı: her yeni derleme eskisinin üzerine kurulabilsin
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
